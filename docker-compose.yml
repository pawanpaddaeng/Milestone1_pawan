# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.

name: cpen321-project

services:
  backend:
    build: ./backend
    # Plain HTTP/WS ports stay published for direct testing (emulator uses
    # http://10.0.2.2:3000). Production traffic goes through Caddy on 443.
    ports:
      - "3000:3000"
      - "8080:8080"
    env_file:
      - path: ./backend/.env
    environment:
      # MongoDB disabled to save memory on the 1 GB EC2 instance (backend doesn't use it yet).
      # MONGODB_URI: mongodb://mongo:27017/cpen321
      # App-level MySQL credentials from the root .env (root password stays with mysql-db).
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # default: reaches mongo and is reached by caddy; db: private link to MySQL.
    networks:
      - default
      - db
    depends_on:
      # mongo:
      #   condition: service_healthy
      mysql-db:
        condition: service_healthy

  # MongoDB disabled to save memory on the 1 GB EC2 instance. To re-enable,
  # uncomment this service, the MONGODB_URI/depends_on lines in backend, and
  # the mongo-data volume below.
  # mongo:
  #   image: mongo:7
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s

  caddy:
    image: caddy:2
    # Only started on EC2: `docker compose --profile prod up -d --build`
    # (or COMPOSE_PROFILES=prod in the root .env). Locally it would fail to get a
    # certificate, since Let's Encrypt validates against the EC2 IP.
    #profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Only SERVER_IP (from the root .env) is passed in, so the internet-facing
    # proxy never sees backend secrets. The Caddyfile builds the sslip.io host from it.
    environment:
      SERVER_IP: ${SERVER_IP:?SERVER_IP must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists issued certificates so restarts don't hit Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  mysql-db:
    image: mysql:8.4
    container_name: mysql_db
    # Credentials come from the root .env (gitignored); see .env.example.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
    # No published ports: only reachable as mysql-db:3306 from services on the
    # internal db network, which only the backend joins.
    networks:
      - db
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema scripts, run only when mysql_data is first created.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Pings over TCP (127.0.0.1, not the socket) so it only passes once the real
    # server is up; the temporary server used while running init scripts has
    # networking disabled.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:
  db:
    internal: true

volumes:
  # mongo-data:
  caddy-data:
  caddy-config:
  mysql_data:
