# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.

name: cpen321-project

services:
  backend:
    build: ./backend
    # Plain HTTP/WS ports stay published for direct testing (emulator uses
    # http://10.0.2.2:3000). Production traffic goes through Caddy on 443.
    ports:
      - "3000:3000"
      - "8080:8080"
    env_file:
      - path: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/cpen321
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Only SERVER_IP (from the root .env) is passed in, so the internet-facing
    # proxy never sees backend secrets. The Caddyfile builds the sslip.io host from it.
    environment:
      SERVER_IP: ${SERVER_IP:?SERVER_IP must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists issued certificates so restarts don't hit Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
